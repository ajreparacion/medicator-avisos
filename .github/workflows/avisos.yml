# MEDICATOR · temporizador gratuito de avisos (pastillas y citas). By Neogest Lab
#
# GitHub NO cumple las tareas programadas cada 5 minutos: en la práctica solo arrancaban unas 4 veces al día.
# Por eso cada ejecución se queda trabajando casi 6 horas, revisando los avisos cada 5 minutos, y antes de
# terminar lanza ella misma la siguiente (relevo). Las ejecuciones programadas solo sirven de reserva por si
# el relevo fallara alguna vez.
name: Avisos MEDICATOR

on:
  schedule:
    - cron: '*/30 * * * *'  # reserva: si no hay ninguna ejecución en marcha, arranca una
    - cron: '17 3 * * 1'    # cada lunes: mantiene vivo el temporizador (GitHub lo pausa tras 60 días sin cambios)
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # para lanzar el relevo al terminar

jobs:
  avisos:
    if: github.event.schedule != '17 3 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 358
    # Solo una a la vez; la siguiente espera en cola y empieza en cuanto termina la anterior
    concurrency:
      group: avisos-medicator
      cancel-in-progress: false
    steps:
      - name: Revisar y enviar avisos cada 5 minutos (casi 6 horas)
        env:
          CRON_TOKEN: ${{ secrets.CRON_TOKEN }}
        run: |
          if [ -z "$CRON_TOKEN" ]; then echo "Falta el secreto CRON_TOKEN"; exit 1; fi
          URL=https://base44.app/api/apps/6ae67de2f75ccdad6e36ab92/functions/avisos-programados
          inicio=$(date +%s)
          limite=$((inicio + 345 * 60))   # 5 h 45 min
          fallos_seguidos=0
          while [ "$(date +%s)" -lt "$limite" ]; do
            ok=0
            for intento in 1 2 3; do
              code=$(curl -sS -o resp.json -w '%{http_code}' --max-time 90 -X POST \
                -H "Content-Type: application/json" -H "X-Cron-Token: $CRON_TOKEN" -d '{}' "$URL" || echo 000)
              echo "$(date -u +%H:%M) intento $intento → HTTP $code $(head -c 300 resp.json 2>/dev/null)"
              if [ "$code" = "200" ]; then ok=1; break; fi
              sleep 10
            done
            if [ "$ok" = 1 ]; then fallos_seguidos=0; else fallos_seguidos=$((fallos_seguidos + 1)); fi
            # Si la función lleva más de 1 hora fallando, se termina en rojo para que se note
            if [ "$fallos_seguidos" -ge 12 ]; then echo "La función de avisos no responde"; exit 1; fi
            # Espera hasta el siguiente múltiplo de 5 minutos
            ahora=$(date +%s)
            sleep $(( 300 - ahora % 300 ))
          done

      - name: Lanzar el relevo
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run avisos.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" || echo "No se pudo lanzar el relevo; arrancará la reserva programada"

  mantener-activo:
    if: github.event.schedule == '17 3 * * 1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Commit de mantenimiento si hace más de 40 días del último
        run: |
          dias=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          echo "Días desde el último cambio: $dias"
          if [ "$dias" -ge 40 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
            date -u +%FT%TZ > .ultimo-mantenimiento
            git add .ultimo-mantenimiento
            git commit -m "Mantener activo el temporizador de avisos"
            git push
          fi
